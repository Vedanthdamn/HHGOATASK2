name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hhgoa-rag
  INSTANCE_ID: i-0d319f1602ef787e8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:latest" -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Redeploy on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:latest"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"docker pull $IMAGE\",\"docker stop hhgoa-rag || true\",\"docker rm hhgoa-rag || true\",\"docker run -d --restart unless-stopped --name hhgoa-rag -p 127.0.0.1:8080:7860 -e SARVAM_API_KEY='$SARVAM_API_KEY' -e ANTHROPIC_API_KEY='$ANTHROPIC_API_KEY' $IMAGE\"]}" \
            --query 'Command.CommandId' --output text)
          echo "Waiting for deployment command $COMMAND_ID..."
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 6
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]

      - name: Verify health
        run: |
          for i in $(seq 1 20); do
            if curl -sf -m 10 https://3.111.3.245.nip.io/health; then
              echo
              echo "Healthy."
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 6
          done
          echo "Service did not become healthy in time"
          exit 1
